<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARP Voice Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
    }
    .orb {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #00d2ff 0%, #0072ff 100%);
      box-shadow: 0 0 50px rgba(0, 210, 255, 0.4);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .orb.recording {
      background: radial-gradient(circle, #ff416c 0%, #ff4b2b 100%);
      box-shadow: 0 0 70px rgba(255, 65, 108, 0.7);
    }
    .orb.thinking {
      background: radial-gradient(circle, #f7b731 0%, #ffa801 100%);
      box-shadow: 0 0 60px rgba(247, 183, 49, 0.6);
      animation: pulse 1.5s infinite alternate;
    }
    .orb.speaking {
      background: radial-gradient(circle, #00ffcc 0%, #0088ff 100%);
      box-shadow: 0 0 80px rgba(0, 255, 204, 0.8);
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }
    .status {
      font-size: 1rem;
      color: #a0a5b5;
    }
    .volume-meter {
      width: 120px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .volume-bar {
      height: 100%;
      width: 0%;
      background: #00d2ff;
      transition: width 0.1s ease;
    }
    .chat-history {
      width: 100%;
      max-width: 600px;
      flex-grow: 1;
      overflow-y: auto;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 5px;
    }
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.assistant { align-self: flex-start; }
    
    .msg {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.user {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      padding: 0 4px;
    }
    .action-icon {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .action-icon:hover { color: #ffffff; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .main-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .main-btn.active { background: #dc2626; }
    .main-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="main-container">
    <div id="orb" class="orb"></div>
    <div class="volume-meter"><div id="volumeBar" class="volume-bar"></div></div>
    <div id="status" class="status">Нажмите для начала разговора</div>
  </div>

  <div id="chatHistory" class="chat-history"></div>

  <div class="controls">
    <button id="callBtn" class="main-btn">Начать разговор</button>
  </div>

  <script>
    let userId = localStorage.getItem('arp_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('arp_user_id', userId);
    }

    let mediaRecorder;
    let audioChunks = [];
    let isCallActive = false;
    let currentAudio = null;

    let audioContext;
    let analyser;
    let microphone;
    let silenceTimer = null;
    let speechDetected = false;
    let isProcessing = false;

    const orb = document.getElementById('orb');
    const statusText = document.getElementById('status');
    const chatHistory = document.getElementById('chatHistory');
    const callBtn = document.getElementById('callBtn');
    const volumeBar = document.getElementById('volumeBar');

    async function loadUserHistory() {
      try {
        const res = await fetch(`/api/history/${userId}`);
        const data = await res.json();
        if (data.history) {
          data.history.forEach(msg => {
            addMessageToUI(msg.role, msg.content);
          });
        }
      } catch (e) {
        console.error('Ошибка загрузки истории:', e);
      }
    }
    loadUserHistory();

    callBtn.addEventListener('click', () => {
      if (!isCallActive) {
        startCall();
      } else {
        stopCall();
      }
    });

    function startCall() {
      isCallActive = true;
      callBtn.textContent = 'Завершить разговор';
      callBtn.classList.add('active');
      startRecording();
    }

    function stopCall() {
      isCallActive = false;
      isProcessing = false;
      callBtn.textContent = 'Начать разговор';
      callBtn.classList.remove('active');
      stopCurrentRecording();

      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      orb.className = 'orb';
      volumeBar.style.width = '0%';
      statusText.textContent = 'Разговор завершен';
    }

    function stopCurrentRecording() {
      clearTimeout(silenceTimer);
      silenceTimer = null;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
        if (mediaRecorder.stream) {
          mediaRecorder.stream.getTracks().forEach(t => t.stop());
        }
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
      }
    }

    async function startRecording() {
      if (!isCallActive || isProcessing) return;

      try {
        stopCurrentRecording();

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        speechDetected = false;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 512;

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          if (stream) stream.getTracks().forEach(t => t.stop());
          if (audioContext && audioContext.state !== 'closed') audioContext.close();
          sendAudio();
        };

        mediaRecorder.start();
        orb.className = 'orb recording';
        statusText.textContent = 'Слушаю вас... Говорите';

        monitorSilence();
      } catch (err) {
        statusText.textContent = 'Ошибка микрофона';
        stopCall();
      }
    }

    function monitorSilence() {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function checkAudio() {
        if (!isCallActive || isProcessing || !mediaRecorder || mediaRecorder.state !== 'recording') return;

        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        let average = sum / dataArray.length;

        // Показываем уровень громкости визуально
        let volumePercent = Math.min(100, Math.max(0, (average / 30) * 100));
        volumeBar.style.width = volumePercent + '%';

        // Снижен порог детекции голоса до 4
        if (average > 4) {
          speechDetected = true;
          clearTimeout(silenceTimer);
          silenceTimer = null;
        } else if (speechDetected && !silenceTimer) {
          silenceTimer = setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          }, 1400);
        }

        requestAnimationFrame(checkAudio);
      }

      checkAudio();
    }

    async function sendAudio() {
      volumeBar.style.width = '0%';

      if (!speechDetected || audioChunks.length === 0) {
        if (isCallActive && !isProcessing) startRecording();
        return;
      }

      isProcessing = true;
      orb.className = 'orb thinking';
      statusText.textContent = 'Думаю и анализирую...';

      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'recording.webm');
      formData.append('userId', userId);

      try {
        const response = await fetch('/api/voice', { method: 'POST', body: formData });
        const data = await response.json();

        if (data.userText && data.userText.trim() !== '') {
          addMessageToUI('user', data.userText);
          addMessageToUI('assistant', data.text);

          if (data.audio) {
            playAssistantAudio(data.audio);
          } else {
            isProcessing = false;
            if (isCallActive) startRecording();
          }
        } else {
          // Если Whisper ничего не расслышал, возвращаемся в режим слушания
          isProcessing = false;
          if (isCallActive) startRecording();
        }
      } catch (err) {
        isProcessing = false;
        orb.className = 'orb';
        statusText.textContent = 'Ошибка обработки';
        if (isCallActive) setTimeout(startRecording, 1000);
      }
    }

    function playAssistantAudio(base64Audio) {
      isProcessing = true;
      stopCurrentRecording();

      orb.className = 'orb speaking';
      statusText.textContent = 'Ассистент говорит...';

      if (currentAudio) {
        currentAudio.pause();
      }

      currentAudio = new Audio("data:audio/mp3;base64," + base64Audio);
      
      currentAudio.onended = () => {
        isProcessing = false;
        if (isCallActive) {
          startRecording();
        } else {
          orb.className = 'orb';
          statusText.textContent = 'Нажмите для начала разговора';
        }
      };

      currentAudio.onerror = () => {
        isProcessing = false;
        if (isCallActive) startRecording();
      };

      currentAudio.play().catch(e => {
        console.error('Ошибка воспроизведения:', e);
        isProcessing = false;
        if (isCallActive) startRecording();
      });
    }

    function addMessageToUI(role, text) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.textContent = role === 'user' ? `Вы: ${text}` : `ARP: ${text}`;
      wrapper.appendChild(msgDiv);

      if (role === 'assistant') {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'msg-actions';

        actionsDiv.innerHTML = `
          <button class="action-icon" onclick="playText(this, \`${text.replace(/`/g, '\\`')}\`)" title="Прослушать">🔊</button>
        `;
        wrapper.appendChild(actionsDiv);
      }

      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    async function playText(btn, text) {
      isProcessing = true;
      stopCurrentRecording();

      if (currentAudio) {
        currentAudio.pause();
      }

      orb.className = 'orb thinking';
      statusText.textContent = 'Озвучиваю заново...';

      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (data.audio) {
          playAssistantAudio(data.audio);
        } else {
          isProcessing = false;
          if (isCallActive) startRecording();
        }
      } catch (e) {
        console.error('Ошибка TTS:', e);
        isProcessing = false;
        if (isCallActive) startRecording();
      }
    }
  </script>
</body>
</html>

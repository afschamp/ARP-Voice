<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .orb-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4facfe 0%, #00f2fe 100%);
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.8);
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
      animation: float 4s ease-in-out infinite;
    }
    .orb.active {
      animation: pulse-active 1.5s ease-in-out infinite alternate;
      background: radial-gradient(circle at 30% 30%, #ff0844 0%, #ffb199 100%);
      box-shadow: 0 0 60px rgba(255, 8, 68, 0.7), inset 0 0 25px rgba(255, 255, 255, 0.9);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.03); }
    }
    @keyframes pulse-active {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
    .status {
      font-size: 1.1rem;
      color: #8a99ad;
      letter-spacing: 0.5px;
    }
    .btn-talk {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn-talk:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="orb-wrapper">
      <div id="orb" class="orb"></div>
    </div>
    <div id="status" class="status">Нажмите для начала разговора</div>
    <button id="talkBtn" class="btn-talk">Начать разговор</button>
  </div>

  <script>
    const orb = document.getElementById('orb');
    const status = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');

    let isTalking = false;

    talkBtn.addEventListener('click', () => {
      isTalking = !isTalking;
      if (isTalking) {
        orb.classList.add('active');
        status.innerText = "Слушаю вас...";
        talkBtn.innerText = "Завершить";
      } else {
        orb.classList.remove('active');
        status.innerText = "Нажмите для начала разговора";
        talkBtn.innerText = "Начать разговор";
      }
    });
  </script>
</body>
</html>

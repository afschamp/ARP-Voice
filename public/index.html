<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice ARP AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      max-width: 500px;
      text-align: center;
      padding: 20px;
    }
    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4facfe 0%, #00f2fe 100%);
      box-shadow: 0 0 50px rgba(0,242,254,0.6);
      animation: float 3s ease-in-out infinite;
      transition: all 0.3s ease;
    }
    .orb.recording {
      animation: pulse 1s ease-in-out infinite alternate;
      background: radial-gradient(circle at 30% 30%, #ff0844 0%, #ffb199 100%);
      box-shadow: 0 0 70px rgba(255,8,68,0.8);
    }
    .orb.thinking {
      animation: pulse 0.5s ease-in-out infinite alternate;
      background: radial-gradient(circle at 30% 30%, #f6d365 0%, #fda085 100%);
      box-shadow: 0 0 70px rgba(253,160,133,0.8);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }
    .status { color: #8a99ad; font-size: 1.1rem; min-height: 24px; }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(37,99,235,0.4);
      transition: all 0.2s ease;
    }
    .btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
    .chat-log {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #cbd5e1;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      width: 100%;
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="orb" class="orb"></div>
    <div id="status" class="status">Нажмите кнопку, чтобы заговорить</div>
    <button id="talkBtn" class="btn">Начать разговор</button>
    <div id="log" class="chat-log" style="display:none;"></div>
  </div>

  <script>
    const orb = document.getElementById("orb");
    const statusText = document.getElementById("status");
    const btn = document.getElementById("talkBtn");
    const log = document.getElementById("log");
    let mediaRecorder, audioChunks = [], activeStream = null;

    btn.onclick = async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      try {
        activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(activeStream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

        mediaRecorder.onstart = () => {
          orb.className = "orb recording";
          statusText.innerText = "Слушаю вас...";
          btn.innerText = "Завершить и отправить";
        };

        mediaRecorder.onstop = async () => {
          orb.className = "orb thinking";
          statusText.innerText = "Думаю и озвучиваю...";
          btn.innerText = "Обработка...";
          btn.disabled = true;

          const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
          const formData = new FormData();
          formData.append("audio", audioBlob, "speech.webm");

          try {
            const res = await fetch("/api/voice", { method: "POST", body: formData });
            const data = await res.json();
            
            if (data.text || data.userText) {
              log.style.display = "block";
              log.innerHTML = `<b>Вы:</b> ${data.userText || "Голосовое сообщение"}<br><br><b>ARP:</b> ${data.text || ""}`;
            }
            if (data.audio) {
              const audio = new Audio("data:audio/mp3;base64," + data.audio);
              audio.play();
            }
            statusText.innerText = "Нажмите кнопку, чтобы заговорить";
          } catch (err) {
            statusText.innerText = "Ошибка при обработке запроса";
          } finally {
            orb.className = "orb";
            btn.innerText = "Начать разговор";
            btn.disabled = false;
            if (activeStream) {
              activeStream.getTracks().forEach(track => track.stop());
            }
          }
        };

        mediaRecorder.start();
      } catch (err) {
        alert("Пожалуйста, разрешите доступ к микрофону в настройках браузера.");
      }
    };
  </script>
</body>
</html>

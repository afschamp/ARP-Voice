<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARP Voice Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
    }
    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #00d2ff 0%, #0072ff 100%);
      box-shadow: 0 0 50px rgba(0, 210, 255, 0.4);
      transition: all 0.5s ease;
      flex-shrink: 0;
    }
    .orb.recording {
      background: radial-gradient(circle, #ff416c 0%, #ff4b2b 100%);
      box-shadow: 0 0 70px rgba(255, 65, 108, 0.7);
      transform: scale(1.08);
    }
    .orb.thinking {
      background: radial-gradient(circle, #f7b731 0%, #ffa801 100%);
      box-shadow: 0 0 60px rgba(247, 183, 49, 0.6);
      animation: pulse 1.5s infinite alternate;
    }
    .orb.speaking {
      background: radial-gradient(circle, #00ffcc 0%, #0088ff 100%);
      box-shadow: 0 0 80px rgba(0, 255, 204, 0.8);
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }
    .status {
      font-size: 1rem;
      color: #a0a5b5;
    }
    .chat-history {
      width: 100%;
      max-width: 600px;
      flex-grow: 1;
      overflow-y: auto;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      max-width: 85%;
      word-wrap: break-word;
    }
    .msg.user {
      background: #2563eb;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 10px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #4b5563; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div class="main-container">
    <div id="orb" class="orb"></div>
    <div id="status" class="status">Нажмите для начала разговора</div>
  </div>

  <div id="chatHistory" class="chat-history"></div>

  <button id="actionBtn">Начать разговор</button>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let conversationHistory = []; // Сохраняем историю переписки

    const orb = document.getElementById('orb');
    const statusText = document.getElementById('status');
    const chatHistory = document.getElementById('chatHistory');
    const actionBtn = document.getElementById('actionBtn');

    actionBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
          mediaRecorder.onstop = sendAudio;

          mediaRecorder.start();
          isRecording = true;
          
          orb.className = 'orb recording';
          statusText.textContent = 'Идет запись... Говорите';
          actionBtn.textContent = 'Завершить и отправить';
        } catch (err) {
          statusText.textContent = 'Ошибка доступа к микрофону';
          console.error(err);
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;

        orb.className = 'orb thinking';
        statusText.textContent = 'Думаю и озвучиваю...';
        actionBtn.disabled = true;
        actionBtn.textContent = 'Обработка...';
      }
    });

    function addMessageToUI(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.textContent = text;
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    async function sendAudio() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'recording.webm');
      formData.append('history', JSON.stringify(conversationHistory));

      try {
        const response = await fetch('/api/voice', { method: 'POST', body: formData });
        const data = await response.json();

        if (data.audio) {
          // Выводим в интерфейс сообщения
          addMessageToUI('user', `Вы: ${data.userText}`);
          addMessageToUI('assistant', `ARP: ${data.text}`);

          // Обновляем массив истории
          conversationHistory.push({ role: 'user', content: data.userText });
          conversationHistory.push({ role: 'assistant', content: data.text });

          orb.className = 'orb speaking';
          statusText.textContent = 'Ассистент говорит...';

          const audio = new Audio("data:audio/mp3;base64," + data.audio);
          audio.play();

          audio.onended = () => {
            orb.className = 'orb';
            statusText.textContent = 'Нажмите для ответа';
            actionBtn.disabled = false;
            actionBtn.textContent = 'Ответить';
          };
        } else {
          throw new Error('Ошибка сервера');
        }
      } catch (err) {
        orb.className = 'orb';
        statusText.textContent = 'Ошибка обработки ответа';
        actionBtn.disabled = false;
        actionBtn.textContent = 'Попробовать снова';
        console.error(err);
      }
    }
  </script>
</body>
</html>

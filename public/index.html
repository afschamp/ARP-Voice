<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARP Voice Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
    }
    .orb {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #00d2ff 0%, #0072ff 100%);
      box-shadow: 0 0 50px rgba(0, 210, 255, 0.4);
      transition: all 0.5s ease;
      flex-shrink: 0;
    }
    .orb.recording {
      background: radial-gradient(circle, #ff416c 0%, #ff4b2b 100%);
      box-shadow: 0 0 70px rgba(255, 65, 108, 0.7);
      transform: scale(1.08);
    }
    .orb.thinking {
      background: radial-gradient(circle, #f7b731 0%, #ffa801 100%);
      box-shadow: 0 0 60px rgba(247, 183, 49, 0.6);
      animation: pulse 1.5s infinite alternate;
    }
    .orb.speaking {
      background: radial-gradient(circle, #00ffcc 0%, #0088ff 100%);
      box-shadow: 0 0 80px rgba(0, 255, 204, 0.8);
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }
    .status {
      font-size: 1rem;
      color: #a0a5b5;
    }
    .chat-history {
      width: 100%;
      max-width: 600px;
      flex-grow: 1;
      overflow-y: auto;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 5px;
    }
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.assistant { align-self: flex-start; }
    
    .msg {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.user {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      padding: 0 4px;
    }
    .action-icon {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .action-icon:hover { color: #ffffff; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .main-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .main-btn.active {
      background: #dc2626;
    }
    .main-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="main-container">
    <div id="orb" class="orb"></div>
    <div id="status" class="status">Нажмите для начала разговора</div>
  </div>

  <div id="chatHistory" class="chat-history"></div>

  <div class="controls">
    <button id="callBtn" class="main-btn">Начать разговор</button>
  </div>

  <script>
    // Получение или создание уникального ID пользователя
    let userId = localStorage.getItem('arp_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('arp_user_id', userId);
    }

    let mediaRecorder;
    let audioChunks = [];
    let isCallActive = false;
    let currentAudio = null;

    const orb = document.getElementById('orb');
    const statusText = document.getElementById('status');
    const chatHistory = document.getElementById('chatHistory');
    const callBtn = document.getElementById('callBtn');

    // Загрузка сохраненной истории с сервера
    async function loadUserHistory() {
      try {
        const res = await fetch(`/api/history/${userId}`);
        const data = await res.json();
        if (data.history) {
          data.history.forEach(msg => {
            addMessageToUI(msg.role, msg.content);
          });
        }
      } catch (e) {
        console.error('Ошибка загрузки истории:', e);
      }
    }
    loadUserHistory();

    callBtn.addEventListener('click', () => {
      if (!isCallActive) {
        startCall();
      } else {
        stopCall();
      }
    });

    function startCall() {
      isCallActive = true;
      callBtn.textContent = 'Завершить разговор';
      callBtn.classList.add('active');
      startRecording();
    }

    function stopCall() {
      isCallActive = false;
      callBtn.textContent = 'Начать разговор';
      callBtn.classList.remove('active');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      if (currentAudio) {
        currentAudio.pause();
      }
      orb.className = 'orb';
      statusText.textContent = 'Разговор завершен';
    }

    async function startRecording() {
      if (!isCallActive) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = sendAudio;

        mediaRecorder.start();
        orb.className = 'orb recording';
        statusText.textContent = 'Слушаю вас... Говорите';
      } catch (err) {
        statusText.textContent = 'Ошибка микрофона';
        stopCall();
      }
    }

    async function sendAudio() {
      if (audioChunks.length === 0) return;

      orb.className = 'orb thinking';
      statusText.textContent = 'Думаю и озвучиваю...';

      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'recording.webm');
      formData.append('userId', userId);

      try {
        const response = await fetch('/api/voice', { method: 'POST', body: formData });
        const data = await response.json();

        if (data.audio) {
          addMessageToUI('user', data.userText);
          addMessageToUI('assistant', data.text);

          playAssistantAudio(data.audio);
        } else {
          throw new Error(' Ошибка сервера');
        }
      } catch (err) {
        orb.className = 'orb';
        statusText.textContent = 'Ошибка обработки';
        if (isCallActive) setTimeout(startRecording, 2000);
      }
    }

    function playAssistantAudio(base64Audio) {
      orb.className = 'orb speaking';
      statusText.textContent = 'Ассистент говорит...';

      if (currentAudio) currentAudio.pause();
      currentAudio = new Audio("data:audio/mp3;base64," + base64Audio);
      currentAudio.play();

      currentAudio.onended = () => {
        if (isCallActive) {
          // Автоматически слушаем ответ пользователя дальше
          startRecording();
        } else {
          orb.className = 'orb';
          statusText.textContent = 'Нажмите для начала разговора';
        }
      };
    }

    function addMessageToUI(role, text) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.textContent = role === 'user' ? `Вы: ${text}` : `ARP: ${text}`;
      wrapper.appendChild(msgDiv);

      if (role === 'assistant') {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'msg-actions';

        actionsDiv.innerHTML = `
          <button class="action-icon" onclick="playText('${text.replace(/'/g, "\\'")}')" title="Прослушать">🔊</button>
          <button class="action-icon" onclick="toggleLike(this)" title="Нравится">👍</button>
          <button class="action-icon" onclick="toggleLike(this)" title="Не нравится">👎</button>
        `;
        wrapper.appendChild(actionsDiv);
      }

      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    async function playText(text) {
      statusText.textContent = 'Озвучиваю заново...';
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (data.audio) {
          playAssistantAudio(data.audio);
        }
      } catch (e) {
        console.error('Ошибка TTS:', e);
      }
    }

    function toggleLike(btn) {
      btn.style.color = btn.style.color === 'rgb(0, 210, 255)' ? '#9ca3af' : '#00d2ff';
    }
  </script>
</body>
</html>

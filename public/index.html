
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Голосовой АРП</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0d0f12;
  color: white;
  font-family: Arial, sans-serif;
}
button, input { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  max-width: 700px;
  margin: auto;
}
.lang-btn, .secondary-btn {
  background: #252b35;
  color: white;
  border: 1px solid #485064;
  border-radius: 9px;
  padding: 9px 13px;
}
.lang-btn.active { background: #2563eb; }
#accountEmail {
  color: #aab6ca;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.auth-box {
  max-width: 390px;
  margin: 50px auto;
  padding: 25px;
  border: 1px solid #354052;
  border-radius: 18px;
  background: #171b23;
}
.auth-box h2 { margin-top: 0; }
.auth-box input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  background: #0d0f12;
  border: 1px solid #566075;
  border-radius: 9px;
  color: white;
}
.auth-box button {
  width: 100%;
  padding: 13px;
  margin-top: 9px;
  border: none;
  border-radius: 9px;
  background: #2563eb;
  color: white;
}
.auth-box .secondary-btn {
  background: #343c4b;
}
#authMessage {
  margin-top: 14px;
  color: #c4d5ee;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

#appArea {
  height: calc(100dvh - 70px);
  max-width: 700px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px;
}
.orb {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: radial-gradient(circle, #00d2ff, #0072ff);
  box-shadow: 0 0 50px #0072ff66;
  margin: 15px auto;
}
.orb.recording {
  background: radial-gradient(circle, #ff416c, #ff4b2b);
}
.orb.thinking {
  background: radial-gradient(circle, #f7b731, #ffa801);
  animation: pulse 1s infinite alternate;
}
.orb.speaking {
  background: radial-gradient(circle, #00ffcc, #0088ff);
  animation: pulse .7s infinite alternate;
}
@keyframes pulse {
  to { transform: scale(1.07); }
}
#status {
  color: #aab6ca;
  text-align: center;
  margin: 12px;
}
#balance {
  border: 1px solid #465065;
  border-radius: 25px;
  padding: 10px 17px;
  color: #93c5fd;
}
#balance.empty { color: #fca5a5; }

#chatHistory {
  width: 100%;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding: 15px 0;
}
.msg-wrapper {
  max-width: 85%;
  display: flex;
  flex-direction: column;
}
.msg-wrapper.user { align-self: flex-end; }
.msg-wrapper.assistant { align-self: flex-start; }
.msg {
  padding: 12px 15px;
  border-radius: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.user { background: #2563eb; }
.msg.assistant {
  background: #252a34;
  border: 1px solid #3b4350;
}
.action-icon {
  background: none;
  border: none;
  color: #cbd5e1;
  padding: 8px;
  align-self: flex-start;
}
.controls {
  padding: 10px;
}
#callBtn {
  padding: 16px 32px;
  border: none;
  border-radius: 30px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}
#callBtn.active { background: #dc2626; }
button:disabled { opacity: .5; cursor: wait; }
</style>
</head>

<body>
<header>
  <div>
    <button id="langRu" class="lang-btn active">РУС</button>
    <button id="langEn" class="lang-btn">ENG</button>
  </div>
  <div>
    <span id="accountEmail"></span>
    <button id="signOutBtn" class="secondary-btn hidden">
      Выйти
    </button>
  </div>
</header>

<section id="authPanel" class="auth-box">
  <h2>Голосовой АРП</h2>
  <p>Войдите или зарегистрируйтесь</p>
  <form id="authForm">
    <input id="authEmail" type="email"
      placeholder="Электронная почта"
      autocomplete="email" required>
    <input id="authPassword" type="password"
      placeholder="Пароль (минимум 8 символов)"
      autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
  <button id="signUpBtn" class="secondary-btn">
    Зарегистрироваться
  </button>
  <p id="authMessage"></p>
</section>

<main id="appArea" class="hidden">
  <div id="orb" class="orb"></div>
  <div id="status">Нажмите для начала разговора</div>
  <div id="balance">Проверяем баланс...</div>
  <div id="chatHistory"></div>
  <div class="controls">
    <button id="callBtn">Начать разговор</button>
  </div>
</main>

<script type="module">
import { createClient } from
  'https://esm.sh/@supabase/supabase-js@2';

const $ = id => document.getElementById(id);

const authPanel = $('authPanel');
const appArea = $('appArea');
const authMessage = $('authMessage');
const orb = $('orb');
const statusText = $('status');
const balanceDiv = $('balance');
const chatHistory = $('chatHistory');
const callBtn = $('callBtn');

let supabase;
let userId = null;
let balance = null;
let currentLang = localStorage.getItem('arp_lang') || 'ru';

let mediaRecorder = null;
let currentStream = null;
let audioContext = null;
let analyser = null;
let audioChunks = [];
let currentAudio = null;
let silenceTimer = null;

let isCallActive = false;
let isProcessing = false;
let speechDetected = false;
let speechStartTime = 0;
let callGeneration = 0;

const NOISE_THRESHOLD = 12;
const SILENCE_DELAY = 1000;
const MIN_SPEECH_TIME = 500;

const translations = {
  ru: {
    start: 'Начать разговор',
    stop: 'Завершить разговор',
    ready: 'Нажмите для начала разговора',
    listening: 'Слушаю вас... Говорите',
    thinking: 'Думаю и обрабатываю...',
    speaking: 'Ассистент говорит...',
    ended: 'Разговор завершён',
    units: 'Осталось единиц: ',
    noUnits: 'Единицы закончились',
    unavailable: 'Баланс недоступен',
    micError: 'Ошибка доступа к микрофону',
    error: 'Ошибка обработки. Попробуйте ещё раз.',
    repeat: 'Прослушать повторно',
    you: 'Вы: ',
    arp: 'АРП: '
  },
  en: {
    start: 'Start Conversation',
    stop: 'End Conversation',
    ready: 'Click to start conversation',
    listening: 'Listening... Speak now',
    thinking: 'Thinking and processing...',
    speaking: 'Assistant is speaking...',
    ended: 'Conversation ended',
    units: 'Units remaining: ',
    noUnits: 'No units remaining',
    unavailable: 'Balance unavailable',
    micError: 'Microphone access error',
    error: 'Processing error. Please try again.',
    repeat: 'Listen again',
    you: 'You: ',
    arp: 'ARP: '
  }
};

function t(key) {
  return translations[currentLang][key];
}

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('arp_lang', lang);

  $('langRu').classList.toggle('active', lang === 'ru');
  $('langEn').classList.toggle('active', lang === 'en');

  if (!isCallActive && !isProcessing) {
    statusText.textContent = t('ready');
    callBtn.textContent = t('start');
  }

  if (balance !== null) {
    updateBalance(balance);
  }
}

$('langRu').onclick = () => setLanguage('ru');
$('langEn').onclick = () => setLanguage('en');

function updateBalance(value) {
  if (!Number.isInteger(value) || value < 0) return;
  balance = value;
  balanceDiv.textContent = t('units') + value;
  balanceDiv.classList.toggle('empty', value === 0);
}

async function authHeaders(extra = {}) {
  const { data, error } = await supabase.auth.getSession();

  if (error || !data.session?.access_token) {
    throw new Error('Требуется вход в аккаунт');
  }

  return {
    ...extra,
    Authorization: 'Bearer ' + data.session.access_token
  };
}

async function loadBalance() {
  if (!userId) return null;

  try {
    const response = await fetch(
      '/api/balance/' + encodeURIComponent(userId),
      {
        headers: await authHeaders(),
        cache: 'no-store'
      }
    );

    if (!response.ok) throw new Error('Ошибка баланса');

    const data = await response.json();
    updateBalance(data.balance);
    return data.balance;
  } catch (error) {
    console.error(error);
    balance = null;
    balanceDiv.textContent = t('unavailable');
    return null;
  }
}

async function loadHistory() {
  if (!userId) return;

  try {
    const response = await fetch(
      '/api/history/' + encodeURIComponent(userId),
      { headers: await authHeaders() }
    );

    if (!response.ok) return;

    const data = await response.json();
    if (Array.isArray(data.history)) {
      data.history.forEach(message => {
        addMessage(message.role, message.content);
      });
    }
  } catch (error) {
    console.error(error);
  }
}

async function applySession(session) {
  const nextId = session?.user?.id || null;
  const changed = nextId !== userId;

  if (changed) {
    stopCall(false);
    chatHistory.replaceChildren();
    balance = null;
  }

  userId = nextId;

  authPanel.classList.toggle('hidden', !!userId);
  appArea.classList.toggle('hidden', !userId);
  $('signOutBtn').classList.toggle('hidden', !userId);
  $('accountEmail').textContent =
    session?.user?.email || '';

  if (userId && changed) {
    await loadBalance();
    await loadHistory();
  }
}

$('authForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (!supabase) return;

  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;

  authMessage.textContent = 'Проверяем данные...';

  const { data, error } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  authMessage.textContent = '';
  await applySession(data.session);
});

$('signUpBtn').onclick = async () => {
  if (!supabase) return;

  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;

  if (!email || password.length < 8) {
    authMessage.textContent =
      'Введите почту и пароль не короче 8 символов.';
    return;
  }

  authMessage.textContent = 'Создаём аккаунт...';

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  if (data.session) {
    await applySession(data.session);
  } else {
    authMessage.textContent =
      'Проверьте почту, подтвердите регистрацию, затем войдите.';
  }
};

$('signOutBtn').onclick = async () => {
  stopCall(false);

  const { error } = await supabase.auth.signOut();

  if (error) {
    statusText.textContent = error.message;
  } else {
    await applySession(null);
  }
};

function cleanupAudio() {
  clearTimeout(silenceTimer);
  silenceTimer = null;

  if (mediaRecorder) {
    mediaRecorder.onstop = null;
    if (mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.stop(); } catch {}
    }
    mediaRecorder = null;
  }

  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
    currentStream = null;
  }

  if (audioContext) {
    audioContext.close().catch(() => {});
    audioContext = null;
  }

  analyser = null;
}

function stopCall(showStatus = true) {
  isCallActive = false;
  isProcessing = false;
  callGeneration++;

  cleanupAudio();

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  orb.className = 'orb';
  callBtn.classList.remove('active');
  callBtn.textContent = t('start');

  if (showStatus) statusText.textContent = t('ended');
}

function showNoUnits() {
  stopCall();
  statusText.textContent = t('noUnits');
}

callBtn.onclick = async () => {
  if (isCallActive) {
    stopCall();
    return;
  }

  callBtn.disabled = true;
  const available = await loadBalance();
  callBtn.disabled = false;

  if (available === null) {
    statusText.textContent = t('unavailable');
    return;
  }

  if (available <= 0) {
    showNoUnits();
    return;
  }

  isCallActive = true;
  callGeneration++;

  callBtn.classList.add('active');
  callBtn.textContent = t('stop');

  await startListening();
};

async function startListening() {
  if (!isCallActive || isProcessing) return;

  if (balance !== null && balance <= 0) {
    showNoUnits();
    return;
  }

  cleanupAudio();

  audioChunks = [];
  speechDetected = false;
  speechStartTime = 0;

  const generation = callGeneration;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    if (!isCallActive || generation !== callGeneration) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    currentStream = stream;
    mediaRecorder = new MediaRecorder(stream);

    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();

    analyser = audioContext.createAnalyser();
    const microphone =
      audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);
    analyser.fftSize = 512;

    mediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) {
        audioChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = () => {
      handleSpeechEnd(generation);
    };

    mediaRecorder.start();

    orb.className = 'orb recording';
    statusText.textContent = t('listening');

    monitorSilence();
  } catch (error) {
    console.error(error);
    stopCall();
    statusText.textContent = t('micError');
  }
}

function monitorSilence() {
  if (!analyser) return;

  const values = new Uint8Array(analyser.frequencyBinCount);

  function check() {
    if (
      !isCallActive ||
      isProcessing ||
      !mediaRecorder ||
      mediaRecorder.state !== 'recording'
    ) return;

    analyser.getByteFrequencyData(values);

    let sum = 0;
    for (const value of values) sum += value;

    const average = sum / values.length;

    if (average > NOISE_THRESHOLD) {
      if (!speechDetected) {
        speechDetected = true;
        speechStartTime = Date.now();
      }

      clearTimeout(silenceTimer);
      silenceTimer = null;

    } else if (speechDetected && !silenceTimer) {
      silenceTimer = setTimeout(() => {
        if (
          mediaRecorder &&
          mediaRecorder.state === 'recording'
        ) {
          mediaRecorder.stop();
        }
      }, SILENCE_DELAY);
    }

    requestAnimationFrame(check);
  }

  check();
}

async function handleSpeechEnd(generation) {
  if (!isCallActive || generation !== callGeneration) return;

  const duration = Date.now() - speechStartTime;

  if (
    !speechDetected ||
    duration < MIN_SPEECH_TIME ||
    audioChunks.length === 0
  ) {
    if (isCallActive) startListening();
    return;
  }

  isProcessing = true;
  orb.className = 'orb thinking';
  statusText.textContent = t('thinking');

  const audioBlob = new Blob(audioChunks, {
    type: mediaRecorder?.mimeType || 'audio/webm'
  });

  cleanupAudio();

  const formData = new FormData();
  formData.append('audio', audioBlob, 'recording.webm');
  formData.append('language', currentLang);

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 120000);

  try {
    const response = await fetch('/api/voice', {
      method: 'POST',
      headers: await authHeaders(),
      body: formData,
      signal: controller.signal
    });

    const data = await response.json();

    if (Number.isInteger(data.balance)) {
      updateBalance(data.balance);
    }

    if (response.status === 402) {
      showNoUnits();
      return;
    }

    if (!response.ok) {
      throw new Error(data.error || 'Ошибка сервера');
    }

    if (!isCallActive || generation !== callGeneration) return;

    if (data.userText) {
      addMessage('user', data.userText);
    }

    if (data.text) {
      addMessage('assistant', data.text);
    }

    if (data.audio) {
      await playAssistantAudio(data.audio);
    }

  } catch (error) {
    console.error(error);

    if (isCallActive && generation === callGeneration) {
      statusText.textContent = t('error');
    }

  } finally {
    clearTimeout(timeout);
    await loadBalance();

    if (generation === callGeneration) {
      isProcessing = false;

      if (isCallActive && balance === 0) {
        showNoUnits();
      } else if (isCallActive) {
        setTimeout(() => startListening(), 300);
      }
    }
  }
}

function playAssistantAudio(base64Audio) {
  return new Promise(resolve => {
    cleanupAudio();

    orb.className = 'orb speaking';
    statusText.textContent = t('speaking');

    if (currentAudio) currentAudio.pause();

    const audio = new Audio(
      'data:audio/mp3;base64,' + base64Audio
    );

    currentAudio = audio;

    let finished = false;

    const finish = () => {
      if (finished) return;
      finished = true;

      if (currentAudio === audio) currentAudio = null;
      resolve();
    };

    audio.onended = finish;
    audio.onerror = finish;
    audio.play().catch(finish);
  });
}

function addMessage(role, content) {
  if (!['user', 'assistant'].includes(role)) return;

  const wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper ' + role;

  const message = document.createElement('div');
  message.className = 'msg ' + role;
  message.textContent =
    (role === 'user' ? t('you') : t('arp')) + content;

  wrapper.appendChild(message);

  if (role === 'assistant' && content) {
    const repeat = document.createElement('button');
    repeat.className = 'action-icon';
    repeat.textContent = '🔊';
    repeat.title = t('repeat');

    repeat.onclick = () => repeatSpeech(repeat, content);
    wrapper.appendChild(repeat);
  }

  chatHistory.appendChild(wrapper);
  chatHistory.scrollTop = chatHistory.scrollHeight;
}

async function repeatSpeech(button, text) {
  if (isProcessing) return;

  button.disabled = true;

  const available = await loadBalance();

  if (available === null || available <= 0) {
    if (available === 0) showNoUnits();
    button.disabled = false;
    return;
  }

  if (isCallActive) stopCall();

  isProcessing = true;
  orb.className = 'orb thinking';

  try {
    const response = await fetch('/api/tts', {
      method: 'POST',
      headers: await authHeaders({
        'Content-Type': 'application/json'
      }),
      body: JSON.stringify({ text })
    });

    const data = await response.json();

    if (Number.isInteger(data.balance)) {
      updateBalance(data.balance);
    }

    if (response.status === 402) {
      showNoUnits();
      return;
    }

    if (!response.ok) {
      throw new Error(data.error || 'Ошибка озвучки');
    }

    if (data.audio) {
      await playAssistantAudio(data.audio);
    }

  } catch (error) {
    console.error(error);
    statusText.textContent = t('error');

  } finally {
    button.disabled = false;
    await loadBalance();
    isProcessing = false;
    orb.className = 'orb';
  }
}

// Загрузка публичных настроек с сервера.
// Секретный ключ в браузер не передаётся.
async function initialize() {
  setLanguage(currentLang);

  try {
    const response = await fetch('/api/public-config', {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('Настройки Supabase недоступны');
    }

    const config = await response.json();

    if (!config.supabaseUrl || !config.supabasePublishableKey) {
      throw new Error('Настройки Supabase не заполнены');
    }

    supabase = createClient(
      config.supabaseUrl,
      config.supabasePublishableKey
    );

    supabase.auth.onAuthStateChange((_event, session) => {
      setTimeout(() => applySession(session), 0);
    });

    const { data, error } = await supabase.auth.getSession();

    if (error) throw error;

    await applySession(data.session);

  } catch (error) {
    console.error(error);
    authMessage.textContent =
      'Не удалось подключить авторизацию. ' +
      'Проверьте настройки сервера.';
  }
}

initialize();
</script>
</body>
</html>
